<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cog Battle Tree Explorer</title>
<!--
  Runs the real solver. The Python package in ../solver is loaded into
  Pyodide and every number on this page comes from it through
  visualizer/bridge.py -- there is no JavaScript copy of the battle rules.

  Layout note: edges are drawn in one SVG layer, nodes are absolutely
  positioned HTML on top of it. SVG <text> is painful to wrap and style;
  HTML is not. The SVG only ever draws curves.

  Served by `python -m visualizer.serve`.
-->
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --bg:#14161a; --panel:#1b1e24; --panel2:#20242b; --line:#33373f;
    --dim:#5b6270; --text:#edeff2; --muted:#98a0ae;
    --decision:#f2a93b; --action:#6fa3c7; --win:#4caf7d; --loss:#d9564a;
    --bucket:#8a93a8; --path:#f2a93b;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:13px/1.45 system-ui, sans-serif; overflow:hidden; }
  .mono { font-family:ui-monospace, Menlo, Consolas, monospace; }

  #shell { display:flex; flex-direction:column; height:100vh; }
  header { padding:10px 16px; border-bottom:1px solid var(--line);
           display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:15px; margin:0; font-weight:700; }
  .hint { color:var(--muted); font-size:11px; }
  main { flex:1; display:flex; min-height:0; }
  #canvas { flex:1; overflow:auto; position:relative; }
  aside { width:310px; border-left:1px solid var(--line); overflow:auto;
          padding:12px; background:var(--panel); flex-shrink:0; }

  button { background:var(--panel2); color:var(--text);
           border:1px solid var(--dim); border-radius:5px; padding:5px 11px;
           font:inherit; cursor:pointer; }
  button:hover { border-color:var(--muted); }
  button.primary { background:var(--decision); color:#14161a; border:0;
                   font-weight:600; }
  button:disabled { opacity:.45; cursor:default; }
  select, input[type=number] { background:#111318; color:var(--text);
           border:1px solid var(--dim); border-radius:4px; padding:3px 5px;
           font:inherit; font-size:12px; }
  label { display:inline-flex; gap:5px; align-items:center;
          color:var(--muted); font-size:11px; }

  .node { position:absolute; width:96px; height:50px; border:1px solid var(--line);
          border-radius:7px; background:var(--panel); padding:3px 4px;
          cursor:pointer; display:flex; flex-direction:column;
          align-items:center; justify-content:center; gap:1px;
          transition:border-color .12s, box-shadow .12s; }
  .node:hover { border-color:var(--muted); }
  .node.sel { box-shadow:0 0 0 2px var(--text) inset; }
  .node.path { border-color:var(--path); }
  .node .top { display:flex; align-items:center; gap:3px; max-width:100%; }
  .node .title { font-size:10px; font-weight:600; white-space:nowrap;
                 overflow:hidden; text-overflow:ellipsis; max-width:84px; }
  .node .sub { color:var(--muted); font-size:10px; white-space:nowrap; }
  .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  /* Artwork is optional -- assets/ is gitignored and only appears once
     tools/fetch_icons.py has run, so every icon hides itself on error and
     the layout is sized to look right either way. */
  .icon { width:22px; height:22px; object-fit:contain; flex-shrink:0;
          image-rendering:auto; }
  .icon.sm { width:16px; height:16px; }
  .icon.lg { width:30px; height:30px; }
  .cogstrip { display:inline-flex; gap:1px; align-items:center;
              margin-left:3px; vertical-align:middle; }
  .cogstrip img { width:12px; height:12px; object-fit:contain; }
  .cogstrip img.dead { opacity:.25; filter:grayscale(1); }
  .chev { color:var(--dim); font-size:10px; margin-left:auto; }

  .card { background:var(--panel2); border:1px solid var(--line);
          border-radius:6px; padding:9px; margin-bottom:10px; }
  .card h3 { margin:0 0 7px; font-size:11px; text-transform:uppercase;
             letter-spacing:.07em; color:var(--muted); font-weight:700; }
  .kv { display:flex; justify-content:space-between; gap:8px; padding:1px 0; }
  .kv span:last-child { color:var(--muted); }
  .bar { height:4px; border-radius:2px; background:var(--line); margin-top:3px; }
  .bar > div { height:100%; border-radius:2px; background:var(--action); }
  .atk { padding:4px 0; border-bottom:1px solid var(--line); }
  .atk:last-child { border-bottom:0; }
  .step { display:flex; gap:7px; padding:3px 0; align-items:baseline; }
  .step .n { color:var(--path); font-weight:700; min-width:14px; }
  .err { color:var(--loss); font-size:12px; }
  /* Gag pouch: one row per track, one column per level, laid out like the
     in-game gag menu so it reads the same way. */
  .gaggrid { display:grid; grid-template-columns:104px repeat(7, 46px);
             gap:3px; align-items:center; }
  .gaghead { font-size:10px; color:var(--muted); text-align:center; }
  .gagtrack { font-size:11px; color:var(--muted); text-transform:capitalize;
              display:flex; align-items:center; gap:4px; }
  .gagcell { position:relative; width:46px; height:46px; border-radius:5px;
             border:1px solid var(--line); background:#111318; cursor:pointer;
             display:flex; align-items:center; justify-content:center; }
  .gagcell:hover { border-color:var(--muted); }
  .gagcell.on { border-color:var(--decision); background:#2a2418; }
  .gagcell.locked { opacity:.28; cursor:not-allowed; }
  .gagcell.full { border-color:var(--win); }   /* at its own carry limit */
  .gagcell img { width:34px; height:34px; object-fit:contain; }
  .gagcell .count { position:absolute; right:2px; bottom:0; font-size:10px;
                    font-weight:700; color:var(--decision);
                    text-shadow:0 0 3px #000; }
  .pouchbar { display:flex; gap:14px; align-items:center; margin-top:8px;
              font-size:11px; color:var(--muted); flex-wrap:wrap; }
  .pouchbar b { color:var(--text); }
  .over { color:var(--loss); font-weight:700; }
  #boot { padding:40px; color:var(--muted); }
</style>
</head>
<body>
<div id="root"><div id="boot">Starting Python…</div></div>

<script type="text/babel" data-type="module">
const {useState, useEffect, useRef, useCallback} = React;

// INDENTED layout: every visible node gets its own row, and depth is a
// small horizontal indent. The tree therefore only ever grows downward.
//
// The alternative -- fanning children out sideways, one column per depth --
// puts the branching factor on the horizontal axis, and branching is what
// makes these trees big: expanding one decision node adds 8 gags, each of
// which adds ~9 outcomes. That reached 12,500px wide. Here the width is
// bounded by depth alone (9 levels x 24px + a card), and expanding anything
// just makes the page taller, which is the scroll direction that costs
// nothing.
// Classic tree: root on top, children fanning out below it.
//
// The reason the earlier attempt at this had to be abandoned was card size,
// not topology -- 340px-wide cards fanning eight ways is 2700px per level.
// Nodes here are small tiles (icon + one number), like the circles in a
// textbook tree diagram, and the detail lives in the inspector. Eight
// children is now ~830px, which fits. Wide trees are still possible if you
// expand everything, so there is a zoom control.
const NODE_W = 96, CARD_H = 50;
const COL_W = 104, ROW_H = 96, PAD_X = 20, PAD_Y = 16;

const KIND = {
  more:     {color:"var(--bucket)",   name:"Collapsed"},
  decision: {color:"var(--decision)", name:"Your turn"},
  action:   {color:"var(--action)",   name:"Gag"},
  terminal: {color:"var(--win)",      name:"End"},
  bucket:   {color:"var(--bucket)",   name:"Rare outcomes"},
};
const pct = (p) => (p * 100).toFixed(p < 0.1 ? 1 : 0) + "%";

/** An icon that removes itself if the file isn't there. */
const Icon = ({name, cls = "", title}) => name
  ? <img className={"icon " + cls} src={"assets/" + name} alt="" title={title}
         onError={(e) => { e.target.style.display = "none"; }} />
  : null;

/* ---------- worker plumbing ------------------------------------------ */

/** The solver runs in a worker (see worker.js), so calls are async and the
 *  UI never blocks on one. Requests carry a generation; anything from a
 *  superseded generation is dropped on arrival, which is what lets a slider
 *  fire freely -- only where it lands has to be computed. */
class Superseded extends Error {
  constructor() { super("superseded"); this.superseded = true; }
}

function makeSolver(onStatus) {
  const worker = new Worker("worker.js");
  const pending = new Map();
  let nextId = 1, generation = 0;
  let ready = null;

  const readyPromise = new Promise((resolve, reject) => {
    ready = {resolve, reject};
  });

  worker.onmessage = (e) => {
    const msg = e.data;
    if (msg.type === "status") { onStatus(msg.text); return; }
    if (msg.type === "ready") { ready.resolve(JSON.parse(msg.catalogue)); return; }
    if (msg.type === "fatal") { ready.reject(new Error(msg.error)); return; }

    const entry = pending.get(msg.id);
    if (!entry) return;
    pending.delete(msg.id);
    if (entry.generation !== generation) return;      // superseded
    if (msg.error) entry.reject(new Error(msg.error));
    else entry.resolve(JSON.parse(msg.result));
  };

  return {
    ready: readyPromise,
    /** Abandon every in-flight request. A worker call cannot be cancelled
     *  mid-search, but it can be made not to matter.
     *
     *  Superseded promises are REJECTED rather than dropped: an awaiting
     *  caller that never hears back just stops, and a half-walked tree
     *  expansion that stalls forever looks exactly like a hang. */
    supersede() {
      generation += 1;
      for (const entry of pending.values()) {
        entry.reject(new Superseded());
      }
      pending.clear();
    },
    call(fn, payload) {
      const id = nextId++;
      return new Promise((resolve, reject) => {
        pending.set(id, {resolve, reject, generation});
        worker.postMessage({id, fn, payload});
      });
    },
  };
}

/* ---------- tree model ------------------------------------------------ */

let nextId = 1;
const mkNode = (raw, parent) => ({
  ...raw, id: nextId++, parent, children: null, open: false, onPath: false,
});

/** The children a node actually renders.
 *
 *  A node marked `pathOnly` (every node on the solver's plan) shows just
 *  its on-path child plus one "+N more" chip. Without that the tree is
 *  almost all leaves -- 57 of 59 nodes in a depth-2 three-cog fight -- and
 *  no orientation can make that fit. Clicking the chip opens the rest. */
function shown(node) {
  if (!node.open || !node.children || !node.children.length) return [];
  if (!node.pathOnly) return node.children;
  const on = node.children.filter(c => c.onPath);
  if (!on.length) return node.children;
  const hidden = node.children.length - on.length;
  if (!hidden) return on;
  if (!node._more) {
    node._more = {kind: "more", id: nextId++, parent: node,
                  label: `+${hidden} more`, owner: node};
  }
  node._more.label = `+${hidden} more`;
  return [...on, node._more];
}

/** Tidy tree: depth sets the row, leaves take the next column, and every
 *  parent centres over its children. Grows downward and outward, like a
 *  tree diagram. */
function layout(root) {
  let col = 0, maxDepth = 0, maxX = 0;
  const walk = (node, depth) => {
    node.y = PAD_Y + depth * ROW_H;
    node.depth = depth;
    maxDepth = Math.max(maxDepth, depth);
    const kids = shown(node);
    if (kids.length) {
      kids.forEach(c => walk(c, depth + 1));
      node.x = (kids[0].x + kids[kids.length - 1].x) / 2;
    } else {
      node.x = PAD_X + col * COL_W;
      col += 1;
    }
    maxX = Math.max(maxX, node.x);
  };
  walk(root, 0);
  return {maxDepth, maxX};
}

const visibleEdges = (root) => {
  const out = [];
  const walk = (n) => {
    for (const c of shown(n)) { out.push([n, c]); walk(c); }
  };
  walk(root);
  return out;
};

/* ---------- node ------------------------------------------------------ */

function NodeCard({node, selected, busy, onSelect}) {
  const style = KIND[node.kind] || KIND.decision;
  const lost = node.kind === "terminal" && /lost/.test(node.label || "");
  const color = lost ? "var(--loss)" : style.color;
  const cls = "node" + (selected ? " sel" : "") + (node.onPath ? " path" : "");

  // A tile is 96px wide, so it gets an icon and one number. The label, the
  // full EV, the outcome breakdown and the cog forecast are all one click
  // away in the inspector -- crowding them in here is what forced the wide
  // cards that made a fanning layout impossible.
  const headline =
    node.ev != null ? `${node.ev > 0 ? "+" : ""}${node.ev.toFixed(0)}`
    : node.prob != null ? pct(node.prob)
    : null;

  return (
    <div className={cls} data-nodeid={node.id}
         style={{left:node.x, top:node.y}}
         title={[node.label,
                 node.ev != null && `EV ${node.ev.toFixed(2)}`,
                 node.gap != null && `+${node.gap.toFixed(2)} over next`,
                 node.prob != null && `p ${pct(node.prob)}`,
                 node.laff_lost > 0 && `-${node.laff_lost} laff`,
                 ...(node.cogs || [])].filter(Boolean).join(String.fromCharCode(10))}
         onClick={(e) => { e.stopPropagation(); onSelect(node); }}>
      <div className="top">
        {node.icon
          ? <Icon name={node.icon} />
          : node.cog_icons && node.cog_icons.length
            ? <span className="cogstrip">
                {node.cog_icons.map((ic, i) => (
                  <Icon key={i} name={ic}
                        cls={node.state && node.state.cogs[i] &&
                             node.state.cogs[i].dead ? "dead" : ""} />
                ))}
              </span>
            : <span className="dot" style={{background:color}} />}
        {busy && <span className="sub">…</span>}
      </div>
      {headline &&
        <div className="sub mono"
             style={{color: node.ev != null ? color : "var(--muted)"}}>
          {headline}
          {node.laff_lost > 0 &&
            <span style={{color:"var(--loss)"}}> −{node.laff_lost}</span>}
        </div>}
      {node.kind === "more" && <div className="sub">{node.label}</div>}
    </div>
  );
}

/* ---------- inspector -------------------------------------------------- */

function Inspector({node, solver, depth, objective}) {
  const [forecast, setForecast] = useState(null);
  const [line, setLine] = useState(null);
  const [busy, setBusy] = useState(false);

  // The forecast is a table lookup, so it loads on selection. `stale`
  // guards against a slow reply landing after you've clicked something
  // else, which would show one node's numbers under another's heading.
  useEffect(() => {
    let stale = false;
    setForecast(null); setLine(null);
    if (!node || !node.state) return undefined;
    solver.call("api_cog_forecast", {state: node.state})
      .then(f => { if (!stale) setForecast(f.error ? {error: f.error} : f.cogs); })
      .catch(e => { if (!stale) setForecast({error: String(e)}); });
    return () => { stale = true; };
  }, [node, solver]);

  // The plan is a full search per step. Off the main thread now, so it no
  // longer freezes anything -- but still on demand, since it is seconds of
  // work nobody asked for on every click.
  const computeLine = () => {
    setBusy(true);
    solver.call("api_best_line", {state: node.state, depth, objective})
      .then(l => setLine(l.error ? null : l.line))
      .catch(() => {})
      .finally(() => setBusy(false));
  };

  if (!node) return <div className="hint">Click a node to inspect it.</div>;

  const st = node.state;
  return (
    <div>
      <div className="card">
        <h3>{node.label}</h3>
        {st && <>
          <div className="kv"><span>Laff</span>
            <span className="mono">{st.toon.laff} / {st.toon.max_laff}</span></div>
          {node.cogs && node.cogs.map((c, i) =>
            <div className="kv" key={i}><span>Cog {i + 1}</span>
              <span className="mono">{c}</span></div>)}
        </>}
        {node.ev != null &&
          <div className="kv"><span>Expected value</span>
            <span className="mono">{node.ev > 0 ? "+" : ""}{node.ev.toFixed(2)}</span></div>}
        {node.gap != null &&
          <div className="kv"><span>Lead over 2nd</span>
            <span className="mono">+{node.gap.toFixed(2)}</span></div>}
        {node.prob != null &&
          <div className="kv"><span>Probability</span>
            <span className="mono">{pct(node.prob)}</span></div>}
      </div>

      {forecast && forecast.error &&
        <div className="card err">{forecast.error}</div>}

      {forecast && !forecast.error && forecast.length > 0 &&
        <div className="card">
          <h3>What the cogs do next</h3>
          {forecast.map((c) => (
            <div key={c.index} style={{marginBottom:9}}>
              <div className="kv" style={{alignItems:"center"}}>
                <span style={{fontWeight:600, color:"var(--text)",
                              display:"flex", alignItems:"center", gap:6}}>
                  <Icon name={c.icon} cls="lg" title={c.cog} />
                  <Icon name={c.dept_icon} cls="sm" title={c.department} />
                  {c.cog} L{c.level}</span>
                <span className="mono">~{c.expected_damage} dmg</span>
              </div>
              {c.lured &&
                <div className="hint">lured {c.lure_rounds}r · acts {pct(c.p_acts)}</div>}
              {c.attacks.map((a) => (
                <div className="atk" key={a.attack}>
                  <div className="kv">
                    <span>{a.attack}{a.group ? " ⁂" : ""}</span>
                    <span className="mono">{pct(a.prob)} · {a.damage} dmg</span>
                  </div>
                  <div className="bar">
                    <div style={{width:pct(a.prob),
                                 background: a.group ? "var(--loss)" : "var(--action)"}} />
                  </div>
                  <div className="hint">hits {pct(a.hit_prob / (a.prob || 1))}</div>
                </div>
              ))}
            </div>
          ))}
          <div className="hint" style={{marginTop:6}}>
            ⁂ hits every toon. Percentages are per cog and independent.
          </div>
        </div>}

      {node.state && !line &&
        <button onClick={computeLine} disabled={busy} style={{width:"100%"}}>
          {busy ? "Searching…" : "Show the plan from here"}</button>}

      {line && line.length > 0 &&
        <div className="card">
          <h3>Solver's plan from here</h3>
          {line.map((s, i) => (
            <div className="step" key={i}>
              <span className="n">{i + 1}</span>
              <span>
                {s.label}
                <div className="hint mono">
                  EV {s.ev > 0 ? "+" : ""}{s.ev.toFixed(1)} · likeliest p {pct(s.prob)}
                  {s.laff_lost > 0 ? ` · −${s.laff_lost} laff` : ""}
                </div>
                {s.terminal && <div className="hint" style={{color:"var(--win)"}}>{s.terminal}</div>}
              </span>
            </div>
          ))}
          <div className="hint" style={{marginTop:6}}>
            Each step takes the most likely outcome, so the whole line is far
            less likely than any single step of it.
          </div>
        </div>}
    </div>
  );
}

/* ---------- app -------------------------------------------------------- */

const DEFAULT_POUCH = {"throw/3":4, "throw/4":2, "sound/4":2, "lure/2":3};

/** The gag menu: a row per track, a column per level, click to add and
 *  shift-click (or right-click) to remove. Cells grey out when adding one
 *  would break a rule the game enforces -- six tracks, one pouch -- rather
 *  than letting you build a loadout the solver will then reject. */
function GagPicker({catalogue, pouch, setPouch}) {
  const limits = catalogue.limits || {max_tracks: 6, max_pouch: 80};
  const byKey = {};
  catalogue.gags.forEach(g => { byKey[`${g.track}/${g.level}`] = g; });

  const total = Object.values(pouch).reduce((a, b) => a + b, 0);
  const tracks = new Set(Object.keys(pouch)
    .filter(k => pouch[k] > 0).map(k => k.split("/")[0]));

  const bump = (key, delta) => setPouch(prev => {
    const next = {...prev};
    const now = (next[key] || 0) + delta;
    if (now <= 0) delete next[key]; else next[key] = now;
    return next;
  });

  const blocked = (key) => {
    const track = key.split("/")[0];
    const gag = byKey[key] || {};
    const held = pouch[key] || 0;
    // Per-gag cap first: it's the one that bites earliest and surprises
    // most -- a Birthday Cake tops out at 3 however empty the pouch is.
    if (gag.max_carry != null && held >= gag.max_carry)
      return `only ${gag.max_carry} fit`;
    if (total >= limits.max_pouch) return "pouch full";
    if (!tracks.has(track) && tracks.size >= limits.max_tracks)
      return `already carrying ${limits.max_tracks} tracks`;
    return null;
  };

  return (
    <div>
      <div className="gaggrid">
        <span />
        {[1,2,3,4,5,6,7].map(l => <span key={l} className="gaghead">{l}</span>)}
        {catalogue.tracks.map(track => (
          <React.Fragment key={track}>
            <span className="gagtrack">{track.replace("_", "-")}</span>
            {[1,2,3,4,5,6,7].map(level => {
              const key = `${track}/${level}`;
              const gag = byKey[key] || {};
              const count = pouch[key] || 0;
              const why = count ? null : blocked(key);
              return (
                <div key={level}
                     className={"gagcell" + (count ? " on" : "") +
                                (why && !count ? " locked" : "") +
                                (why && count ? " full" : "")}
                     title={`${gag.name}${gag.group ? " (group)" : ""}`
                            + ` -- max ${gag.max_carry}`
                            + (why ? ` (${why})` : "")}
                     onContextMenu={(e) => { e.preventDefault(); bump(key, -1); }}
                     onClick={(e) => {
                       if (e.shiftKey) return bump(key, -1);
                       if (!why) bump(key, +1);
                     }}>
                  <Icon name={gag.icon} />
                  {count > 0 && <span className="count">{count}</span>}
                </div>
              );
            })}
          </React.Fragment>
        ))}
      </div>
      <div className="pouchbar">
        <span>Pouch <b className={total > limits.max_pouch ? "over" : ""}>
          {total}</b> / {limits.max_pouch}</span>
        <span>Tracks <b className={tracks.size > limits.max_tracks ? "over" : ""}>
          {tracks.size}</b> / {limits.max_tracks}</span>
        <span>click to add · shift-click or right-click to remove</span>
        <button onClick={() => setPouch({})}>Empty</button>
        <button onClick={() => setPouch(DEFAULT_POUCH)}>Reset</button>
      </div>
    </div>
  );
}

function App({solver, catalogue}) {
  const depts = catalogue.departments;
  const [dept, setDept] = useState("bossbot");
  const [cogs, setCogs] = useState([
    {type:"flunky", level:4}, {type:"pencil_pusher", level:5},
    {type:"yesman", level:6},
  ]);
  const [laff, setLaff] = useState(45);
  const [depth, setDepth] = useState(2);
  const [pouch, setPouch] = useState(DEFAULT_POUCH);
  const [showCfg, setShowCfg] = useState(false);
  const [root, setRoot] = useState(null);
  // Progressive rendering swaps the root object when the deeper pass lands,
  // so anything that walks the tree asynchronously has to read the CURRENT
  // root, not the one captured when its handler was created -- otherwise it
  // quietly annotates a tree that is no longer on screen.
  const rootRef = useRef(null);
  const setTree = (node) => { rootRef.current = node; setRoot(node); };
  const [selected, setSelected] = useState(null);
  const [, bump] = useState(0);
  const [busyId, setBusyId] = useState(null);
  const [refining, setRefining] = useState(false);
  const [planSummary, setPlanSummary] = useState(null);
  const [zoom, setZoom] = useState(1);
  const [preset, setPreset] = useState("balanced");
  const [gagCost, setGagCost] = useState(null);   // null = the preset's own
  const [gagCostDraft, setGagCostDraft] = useState(null);
  const [focusId, setFocusId] = useState(null);
  const [err, setErr] = useState(null);
  const canvasRef = useRef(null);
  const rerender = () => bump(v => v + 1);

  const cogTypes = depts[dept];
  const presetDef = (catalogue.objectives || [])
    .find(o => o.name === preset) || {gag_cost: 0.1};
  const presetGagCost = presetDef.gag_cost;
  // Sent with every call: the objective is part of the question, not a
  // setting on the solver, so it travels with the request.
  const objective = gagCost != null
    ? {preset, gag_cost: gagCost} : {preset};
  const shownGagCost = gagCostDraft != null ? gagCostDraft
    : gagCost != null ? gagCost : presetGagCost;

  // The label follows the handle at once; the search only starts once the
  // handle stops. Dragging across the slider is one rebuild, not forty.
  useEffect(() => {
    if (gagCostDraft == null) return undefined;
    const timer = setTimeout(() => setGagCost(gagCostDraft), 250);
    return () => clearTimeout(timer);
  }, [gagCostDraft]);
  const levelsFor = (t) => (cogTypes.find(c => c.type === t) || cogTypes[0]).levels;

  // eslint-disable-next-line react-hooks/exhaustive-deps
  const expand = useCallback(async (node, atDepth) => {
    if (node.children || node.kind === "terminal" || node.kind === "bucket")
      return node.children;
    let res;
    try {
      res = node.kind === "action"
        ? await solver.call("api_expand_action",
                            {state: node.state, action: node.action, objective})
        : await solver.call("api_expand_decision",
                            {state: node.state,
                             depth: atDepth != null ? atDepth : depth,
                             objective});
    } catch (e) {
      if (e.superseded) return null;      // a newer request replaced this
      setErr(String(e));
      node.children = [];
      return node.children;
    }
    if (res.error) { setErr(res.error); node.children = []; }
    else { node.children = res.children.map(c => mkNode(c, node)); }
    return node.children;
  }, [solver, depth, preset, gagCost]);

  const toggle = async (node) => {
    if (node.kind === "more") {
      node.owner.pathOnly = false;
      setFocusId(node.owner.id);
      rerender();
      return;
    }
    setSelected(node);
    setFocusId(node.id);
    if (node.kind === "terminal" || node.kind === "bucket") { rerender(); return; }
    if (!node.open && !node.children) {
      setBusyId(node.id);
      await expand(node);
      node.open = true;
      setBusyId(null);
      rerender();
      return;
    }
    node.open = !node.open;
    rerender();
  };

  /** Two passes. Depth 1 costs nothing and lands immediately, so the tree
   *  is on screen and interactive at once; the full-depth answer replaces
   *  it whenever the worker gets there. Changing a setting therefore feels
   *  instant even when the real search behind it takes seconds. */
  const rebuild = async () => {
    setErr(null);
    solver.supersede();                     // drop anything still in flight
    setPlanSummary(null);
    const gags = Object.entries(pouch)
      .map(([k, n]) => [k.split("/")[0], +k.split("/")[1], n]);
    const cfg = {laff, cogs: cogs.map(c => ({...c, department: dept})), gags};

    let raw;
    try {
      raw = await solver.call("api_root", cfg);
    } catch (e) {
      if (e.superseded) return;
      setErr(String(e)); return;
    }
    if (raw.error) { setErr(raw.error); return; }

    const shallow = mkNode(raw, null);
    if (await expand(shallow, 1) === null) return;
    shallow.open = true;
    setTree(shallow); setSelected(shallow); setFocusId(shallow.id);
    setRefining(depth > 1);
    rerender();

    if (depth <= 1) return;
    const full = mkNode(raw, null);
    if (await expand(full, depth) === null) return;   // superseded
    full.open = true;
    setTree(full); setSelected(full); setFocusId(full.id);
    setRefining(false);
    rerender();
  };

  useEffect(() => { rebuild(); }, []);   // eslint-disable-line react-hooks/exhaustive-deps

  // Every EV in the tree was computed under the old objective, so the whole
  // thing is stale the moment it changes. Rebuild rather than show a mix.
  const firstRender = useRef(true);
  useEffect(() => {
    if (firstRender.current) { firstRender.current = false; return; }
    rebuild();
  }, [preset, gagCost]);   // eslint-disable-line react-hooks/exhaustive-deps

  /** Walk the solver's own recommendation down the tree, opening as it
   *  goes, so the plan is visible as a highlighted spine rather than
   *  something you have to hunt for by clicking. */
  const revealBestPath = async () => {
    const root = rootRef.current;
    if (!root) return;
    const clear = (n) => {
      n.onPath = false; n.pathOnly = false;
      (n.children || []).forEach(clear);
    };
    clear(root);

    setBusyId(root.id);
    const spine = [];

    // The walk visits one node per step and the spine alternates
    // decision -> action, so a fight of N rounds is 2N nodes. The old cap of
    // 8 was 4 rounds, which cut a 5-round plan off one move from the end and
    // made the solver look like it stopped short of winning. Bound it by
    // what the pouch allows instead: no line can outlast the gags.
    const gagsLeft = Object.values(pouch).reduce((a, b) => a + b, 0);
    const maxNodes = 2 * (gagsLeft + 1) + 2;

    let node = root, guard = 0;
    while (node && guard++ < maxNodes) {
      node.onPath = true;
      node.pathOnly = true;     // show only the plan; siblings collapse
      spine.push(node);
      const kids = await expand(node);
      if (!kids || !kids.length) break;    // null means superseded
      node.open = true;

      if (node.kind === "decision") {
        const best = kids.find(k => k.best) || kids[0];
        best.onPath = true; spine.push(best); node = best;
      } else if (node.kind === "action") {
        const likeliest = kids[0];      // expand_action sorts by probability
        likeliest.onPath = true; spine.push(likeliest);
        if (likeliest.kind !== "decision") { break; }
        node = likeliest;
      } else break;
    }
    setBusyId(null);
    // Focus the first move rather than the root: on-path children sort
    // first, so the spine runs along the top of the canvas and centring the
    // root would leave the plan itself off-screen above.
    setFocusId((spine[1] || root).id);
    setSelected(spine[1] || root);
    rerender();
  };

  const collapseAll = () => {
    const current = rootRef.current;
    if (!current) return;
    const walk = (n) => {
      n.open = false; n.onPath = false; n.pathOnly = false;
      (n.children || []).forEach(walk);
    };
    walk(current); current.open = true; rerender();
  };

  useEffect(() => {
    if (focusId == null || !canvasRef.current) return;
    const el = canvasRef.current.querySelector(`[data-nodeid="${focusId}"]`);
    if (el) el.scrollIntoView({block: "center", inline: "start",
                               behavior: "smooth"});
  });

  if (!root) return <div id="boot">Building tree…</div>;

  const {maxDepth, maxX} = layout(root);
  const edges = visibleEdges(root);
  const width = maxX + NODE_W + 60;
  const height = PAD_Y + (maxDepth + 1) * ROW_H + 60;

  return (
    <div id="shell">
      <header>
        <h1>Cog Battle Tree Explorer</h1>
        <button className="primary" disabled={busyId != null || refining}
                onClick={() => { setBusyId(root.id); revealBestPath(); }}>
          {busyId != null ? "Searching…"
                          : refining ? "Refining…" : "Show best path"}</button>
        <button onClick={collapseAll}>Collapse</button>
        <button onClick={() => setShowCfg(s => !s)}>
          {showCfg ? "Hide setup" : "Setup"}</button>
        <label>Depth
          <select value={depth} onChange={e => setDepth(+e.target.value)}>
            {[1,2,3,4].map(d => <option key={d} value={d}>{d}</option>)}
          </select>
        </label>
        <label>Plays like
          <select value={preset} onChange={e => {
            setPreset(e.target.value); setGagCost(null); setGagCostDraft(null);
          }}>
            {(catalogue.objectives || []).map(o =>
              <option key={o.name} value={o.name} title={o.description}>
                {o.name}</option>)}
          </select>
        </label>
        <label title="How much spending a gag costs, per level. Raise it and
the solver stops burning big gags for small gains.">
          Gag cost
          <input type="range" min="0" max="100" style={{width:70}}
                 value={shownGagCost * 100}
                 onChange={e => setGagCostDraft(+e.target.value / 100)} />
          <span className="mono">{shownGagCost.toFixed(2)}</span>
        </label>
        <label>Zoom
          <input type="range" min="40" max="100" value={zoom * 100}
                 style={{width:80}}
                 onChange={e => setZoom(+e.target.value / 100)} />
        </label>
        <span className="hint">
          {refining ? "refining in the background…"
            : planSummary
              ? <span>plan: <b style={{color:"var(--path)"}}>{planSummary}</b></span>
              : "Click a node to expand it · gold spine = the solver's plan"}
        </span>
        {err && <span className="err">{err}</span>}
      </header>

      {showCfg &&
        <div style={{padding:"10px 16px", borderBottom:"1px solid var(--line)",
                     display:"flex", gap:12, flexWrap:"wrap", alignItems:"center"}}>
          <label>Department
            <span style={{display:"flex", alignItems:"center", gap:5}}>
            <Icon name={(catalogue.emblems || {})[dept]} cls="lg" />
            <select value={dept} onChange={e => {
              const d = e.target.value; setDept(d);
              setCogs(depts[d].slice(0, 3).map(c => ({type:c.type, level:c.levels[0]})));
            }}>
              {Object.keys(depts).map(d => <option key={d} value={d}>{d}</option>)}
            </select>
            </span>
          </label>
          <label>Laff
            <input type="number" min="15" max="140" value={laff} style={{width:64}}
                   onChange={e => setLaff(+e.target.value)} />
          </label>
          {cogs.map((c, i) => (
            <label key={i}>Cog {i + 1}
              <Icon name={`cog-${dept}-${c.type}.png`} cls="lg" />
              <select value={c.type} onChange={e => setCogs(cs => cs.map((x, j) =>
                  j === i ? {type:e.target.value,
                             level:levelsFor(e.target.value)[0]} : x))}>
                {cogTypes.map(t => <option key={t.type} value={t.type}>{t.label}</option>)}
              </select>
              <select value={c.level} onChange={e => setCogs(cs => cs.map((x, j) =>
                  j === i ? {...x, level:+e.target.value} : x))}>
                {levelsFor(c.type).map(l => <option key={l} value={l}>L{l}</option>)}
              </select>
              <button onClick={() => setCogs(cs => cs.filter((_, j) => j !== i))}>×</button>
            </label>
          ))}
          {cogs.length < 4 &&
            <button onClick={() => setCogs(cs => [...cs,
              {type:cogTypes[0].type, level:cogTypes[0].levels[0]}])}>+ cog</button>}
          <button className="primary" onClick={rebuild}>Rebuild</button>
          <div style={{width:"100%", marginTop:4}}>
            <GagPicker catalogue={catalogue} pouch={pouch} setPouch={setPouch} />
          </div>
        </div>}

      <main>
        <div id="canvas" ref={canvasRef} onClick={() => setSelected(root)}>
          <div style={{position:"relative", width: width * zoom,
                       height: height * zoom}}>
           <div style={{position:"absolute", left:0, top:0, width, height,
                        transform:`scale(${zoom})`, transformOrigin:"0 0"}}>
            <svg width={width} height={height}
                 style={{position:"absolute", left:0, top:0, pointerEvents:"none"}}>
              {edges.map(([a, b], i) => {
                const x1 = a.x + NODE_W / 2, y1 = a.y + CARD_H;
                const x2 = b.x + NODE_W / 2, y2 = b.y;
                const mid = (y1 + y2) / 2;
                const lit = a.onPath && b.onPath;
                return <path key={i}
                  d={`M${x1},${y1} C${x1},${mid} ${x2},${mid} ${x2},${y2}`}
                  fill="none" stroke={lit ? "var(--path)" : "var(--line)"}
                  strokeWidth={lit ? 2.2 : 1.2} />;
              })}
            </svg>
            {(() => {
              const out = [];
              const walk = (n) => {
                out.push(<NodeCard key={n.id} node={n}
                                   selected={selected && selected.id === n.id}
                                   busy={busyId === n.id}
                                   onSelect={toggle} />);
                shown(n).forEach(walk);
              };
              walk(root);
              return out;
            })()}
           </div>
          </div>
        </div>
        <aside><Inspector node={selected} solver={solver} depth={depth}
                          objective={objective} /></aside>
      </main>
    </div>
  );
}

/* ---------- mount ----------------------------------------------------- */

(async () => {
  const mount = ReactDOM.createRoot(document.getElementById("root"));
  const show = (msg) => mount.render(<div id="boot">{msg}</div>);
  show("Starting the solver…");
  try {
    const solver = makeSolver(show);
    const catalogue = await solver.ready;
    mount.render(<App solver={solver} catalogue={catalogue} />);
  } catch (e) {
    mount.render(<div id="boot" className="err">Failed to start: {String(e)}</div>);
  }
})();
</script>
</body>
</html>
