<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cog Battle Tree Explorer</title>
<!--
  Runs the real solver. The Python package in ../solver is loaded into
  Pyodide and every number on this page comes from it through
  visualizer/bridge.py -- there is no JavaScript copy of the battle rules.
  That is deliberate: the previous version of this page had its own port,
  and it drifted until it disagreed with the model on lure duration, group
  gags, and cog accuracy all at once.

  Served by `python -m visualizer.serve`.
-->
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --bg:#14161a; --panel:#1b1e24; --line:#33373f; --dim:#5b6270;
    --text:#edeff2; --muted:#98a0ae;
    --decision:#f2a93b; --action:#6fa3c7; --win:#4caf7d; --loss:#d9564a;
    --bucket:#8a93a8;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.5 system-ui, sans-serif; padding:20px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:12px; margin:0 0 16px; max-width:70ch; }
  .panel { background:var(--panel); border:1px solid var(--line);
           border-radius:8px; padding:12px; margin-bottom:14px; }
  .row { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; }
  label { display:flex; flex-direction:column; gap:4px; font-size:12px;
          color:var(--muted); }
  select, input[type=number] { background:#111318; color:var(--text);
          border:1px solid var(--dim); border-radius:4px; padding:4px 6px;
          font:inherit; font-size:13px; }
  button { background:var(--decision); color:#14161a; border:0;
           border-radius:4px; padding:7px 14px; font:inherit;
           font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--muted);
                 border:1px solid var(--dim); font-weight:400;
                 padding:3px 8px; font-size:12px; }
  button:disabled { opacity:.45; cursor:default; }
  code, .mono { font-family:ui-monospace, Menlo, Consolas, monospace; }
  .node { border:1px solid; border-radius:7px; padding:7px 10px;
          margin:0 0 6px; cursor:pointer; background:var(--panel); }
  .node.leaf { cursor:default; }
  .badge { font-size:10px; text-transform:uppercase; letter-spacing:.06em;
           font-weight:700; padding:1px 6px; border-radius:3px; }
  .kids { margin-left:14px; padding-left:10px; border-left:1px solid var(--line); }
  .meta { color:var(--muted); font-size:12px; }
  .cogs { color:var(--muted); font-size:12px; margin-top:3px; }
  .err { color:var(--loss); font-size:12px; }
  .best { box-shadow:0 0 0 1px var(--decision) inset; }
  table.legend td { padding:1px 12px 1px 0; font-size:12px; color:var(--muted); }
  #boot { color:var(--muted); }
</style>
</head>
<body>
<div id="root"><div id="boot">Starting Python…</div></div>

<script type="text/babel" data-type="module">
const {useState, useEffect, useCallback} = React;

/* ---------- Pyodide boot: mount the repo's .py files, import bridge ---- */

async function boot(setStatus) {
  setStatus("Downloading Python runtime (~10 MB, cached after the first run)…");
  const pyodide = await loadPyodide();

  setStatus("Loading solver source…");
  const manifest = await (await fetch("/api/manifest")).json();
  for (const rel of manifest.files) {
    const src = await (await fetch("/" + rel)).text();
    const full = "/app/" + rel;
    const dir = full.slice(0, full.lastIndexOf("/"));
    pyodide.FS.mkdirTree(dir);
    pyodide.FS.writeFile(full, src);
  }

  setStatus("Importing solver…");
  pyodide.runPython(`
import sys
for p in ("/app", "/app/visualizer"):
    if p not in sys.path:
        sys.path.insert(0, p)
import bridge
`);
  return pyodide.pyimport("bridge");
}

const call = (fn, payload) => JSON.parse(fn(JSON.stringify(payload)));

/* ---------- tree ------------------------------------------------------ */

const STYLES = {
  decision: {color:"var(--decision)", badge:"Your move"},
  action:   {color:"var(--action)",   badge:"Action"},
  terminal: {color:"var(--win)",      badge:"End"},
  bucket:   {color:"var(--bucket)",   badge:"Bucketed"},
};

function Node({node, bridge, searchDepth, depth}) {
  const [open, setOpen] = useState(depth === 0);
  const [kids, setKids] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);

  const isLeaf = node.kind === "bucket" || node.kind === "terminal";
  const lost = node.kind === "terminal" && /lost/.test(node.label);
  const style = STYLES[node.kind] || STYLES.decision;
  const color = lost ? "var(--loss)" : style.color;

  const load = useCallback(() => {
    if (isLeaf || kids !== null) return;
    setBusy(true);
    // Let the browser paint the spinner before Python blocks the thread.
    setTimeout(() => {
      try {
        const res = node.kind === "action"
          ? call(bridge.api_expand_action, {state: node.state, action: node.action})
          : call(bridge.api_expand_decision, {state: node.state, depth: searchDepth});
        if (res.error) setErr(res.error); else setKids(res.children);
      } catch (e) { setErr(String(e)); }
      setBusy(false);
    }, 0);
  }, [node, kids, isLeaf, bridge, searchDepth]);

  useEffect(() => { if (depth === 0) load(); }, [depth, load]);

  const toggle = () => {
    if (isLeaf) return;
    if (!open) load();
    setOpen(o => !o);
  };

  return (
    <div>
      <div className={"node" + (isLeaf ? " leaf" : "") + (node.best ? " best" : "")}
           style={{borderColor: color + "66"}} onClick={toggle}>
        <div style={{display:"flex", gap:8, alignItems:"center", flexWrap:"wrap"}}>
          {!isLeaf && <span className="mono" style={{color:"var(--dim)"}}>{open ? "▾" : "▸"}</span>}
          <span className="badge" style={{color, background:color+"22"}}>{style.badge}</span>
          <span>{node.label}</span>
          {node.ev != null &&
            <span className="mono" style={{color}}>EV {node.ev > 0 ? "+" : ""}{node.ev.toFixed(2)}</span>}
          {node.gap != null &&
            <span className="mono meta">+{node.gap.toFixed(2)} vs next</span>}
          {node.prob != null &&
            <span className="mono meta">p={node.prob.toFixed(3)}</span>}
          {node.reward != null &&
            <span className="mono meta">reward {node.reward > 0 ? "+" : ""}{node.reward.toFixed(1)}</span>}
          {busy && <span className="meta">thinking…</span>}
        </div>
        {node.cogs && node.cogs.length > 0 &&
          <div className="cogs">
            {node.state && <span className="mono">Laff {node.state.toon.laff} · </span>}
            {node.cogs.join(" · ")}
          </div>}
        {err && <div className="err">{err}</div>}
      </div>
      {open && kids &&
        <div className="kids">
          {kids.length === 0 && <div className="meta">No playable actions left.</div>}
          {kids.map((k, i) => <Node key={i} node={k} bridge={bridge}
                                    searchDepth={searchDepth} depth={depth + 1} />)}
        </div>}
    </div>
  );
}

/* ---------- config + app --------------------------------------------- */

const DEFAULT_GAGS = [
  ["throw", 3, 4], ["throw", 4, 2], ["sound", 4, 2], ["lure", 2, 3],
];

function App({bridge, catalogue}) {
  const depts = catalogue.departments;
  const [dept, setDept] = useState("bossbot");
  const [cogs, setCogs] = useState([
    {type:"flunky", level:4}, {type:"pencil_pusher", level:5},
  ]);
  const [laff, setLaff] = useState(45);
  const [searchDepth, setSearchDepth] = useState(2);
  const [gags, setGags] = useState(DEFAULT_GAGS);
  const [root, setRoot] = useState(null);
  const [treeKey, setTreeKey] = useState(0);

  const cogTypes = depts[dept];
  const levelsFor = (t) => (cogTypes.find(c => c.type === t) || cogTypes[0]).levels;

  const rebuild = () => {
    const cfg = {laff, cogs: cogs.map(c => ({...c, department: dept})), gags};
    setRoot(call(bridge.api_root, cfg));
    setTreeKey(k => k + 1);
  };
  useEffect(rebuild, []);   // eslint-disable-line react-hooks/exhaustive-deps

  const setCog = (i, patch) => setCogs(cs => cs.map((c, j) => {
    if (j !== i) return c;
    const next = {...c, ...patch};
    if (patch.type && !levelsFor(patch.type).includes(next.level))
      next.level = levelsFor(patch.type)[0];
    return next;
  }));

  return (
    <div>
      <h1>Cog Battle Tree Explorer</h1>
      <p className="sub">
        Every number here is computed by the Python solver running in your
        browser — accuracy, damage, lure duration and the expectimax values
        all come from <code>solver/</code> via Pyodide. Nodes expand lazily,
        so the tree is only ever computed where you look. The
        <strong> +N vs next</strong> figure is the gap to the runner-up: near
        zero means the choice barely matters.
      </p>

      <div className="panel">
        <div className="row">
          <label>Department
            <select value={dept} onChange={e => {
              const d = e.target.value;
              setDept(d);
              setCogs(depts[d].slice(0, 2).map(c => ({type:c.type, level:c.levels[0]})));
            }}>
              {Object.keys(depts).map(d => <option key={d} value={d}>{d}</option>)}
            </select>
          </label>
          <label>Toon laff
            <input type="number" min="15" max="140" value={laff}
                   onChange={e => setLaff(+e.target.value)} style={{width:80}} />
          </label>
          <label>Search depth
            <select value={searchDepth} onChange={e => setSearchDepth(+e.target.value)}>
              {[1,2,3].map(d => <option key={d} value={d}>{d}</option>)}
            </select>
          </label>
          <button onClick={rebuild}>Rebuild tree</button>
        </div>

        <div style={{marginTop:12}}>
          <div className="meta" style={{marginBottom:6}}>Cogs</div>
          {cogs.map((c, i) => (
            <div className="row" key={i} style={{marginBottom:6}}>
              <select value={c.type} onChange={e => setCog(i, {type:e.target.value})}>
                {cogTypes.map(t => <option key={t.type} value={t.type}>{t.label}</option>)}
              </select>
              <select value={c.level} onChange={e => setCog(i, {level:+e.target.value})}>
                {levelsFor(c.type).map(l => <option key={l} value={l}>Level {l}</option>)}
              </select>
              <button className="ghost"
                      onClick={() => setCogs(cs => cs.filter((_, j) => j !== i))}>remove</button>
            </div>
          ))}
          {cogs.length < 4 &&
            <button className="ghost" onClick={() => setCogs(cs => [...cs,
              {type:cogTypes[0].type, level:cogTypes[0].levels[0]}])}>+ add cog</button>}
        </div>

        <div style={{marginTop:12}}>
          <div className="meta" style={{marginBottom:6}}>Gag pouch (toon is maxed in every track carried)</div>
          {gags.map((g, i) => (
            <div className="row" key={i} style={{marginBottom:6}}>
              <select value={g[0] + "/" + g[1]} onChange={e => {
                const [track, lvl] = e.target.value.split("/");
                setGags(gs => gs.map((x, j) => j === i ? [track, +lvl, x[2]] : x));
              }}>
                {catalogue.gags.map(o =>
                  <option key={o.track + o.level} value={o.track + "/" + o.level}>
                    {o.name}{o.group ? " (group)" : ""}
                  </option>)}
              </select>
              <input type="number" min="1" max="9" value={g[2]} style={{width:64}}
                     onChange={e => setGags(gs => gs.map((x, j) =>
                       j === i ? [x[0], x[1], +e.target.value] : x))} />
              <button className="ghost"
                      onClick={() => setGags(gs => gs.filter((_, j) => j !== i))}>remove</button>
            </div>
          ))}
          <button className="ghost"
                  onClick={() => setGags(gs => [...gs, ["throw", 1, 3]])}>+ add gag</button>
        </div>
      </div>

      <div className="panel">
        <table className="legend"><tbody><tr>
          {Object.entries(STYLES).map(([k, v]) =>
            <td key={k}><span className="badge"
              style={{color:v.color, background:v.color+"22"}}>{v.badge}</span></td>)}
          <td>outlined = solver's pick</td>
        </tr></tbody></table>
      </div>

      {root && <Node key={treeKey} node={root} bridge={bridge}
                     searchDepth={searchDepth} depth={0} />}
    </div>
  );
}

/* ---------- mount ----------------------------------------------------- */

(async () => {
  const mount = ReactDOM.createRoot(document.getElementById("root"));
  const status = (msg) => mount.render(<div id="boot">{msg}</div>);
  try {
    const bridge = await boot(status);
    const catalogue = JSON.parse(bridge.api_catalogue());
    mount.render(<App bridge={bridge} catalogue={catalogue} />);
  } catch (e) {
    mount.render(<div className="err">Failed to start: {String(e)}</div>);
  }
})();
</script>
</body>
</html>
